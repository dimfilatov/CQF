[data]
yahoo_symbol=SPY
start_date=2010-01-01
end_date=2026-10-14
test_size=0.2
required_columns = ["open", "high", "low", "close", "volume"]
windows = [5, 10, 15]
vol_scale = 0.5

[model]
random_state=42
n_jobs=-1
learning_rate= [0.01, 0.03, 0.05, 0.07, 0.09]
max_depth=[1, 2, 3, 4, 5]
random_strength=[0, 0.5, 1]
subsample=[0.7, 0.8, 0.9, 1.0]
min_child_weight=[1, 3, 5, 7]
gamma=[0.0, 0.1, 0.2, 0.3, 0.4]
reg_alpha=[0, 0.01, 0.1, 1, 5]
reg_lambda=[1, 5, 10, 20, 50]
colsample_bytree=[0.4, 0.6, 0.8, 1]
n_estimators=[100, 200, 300]
n_iter= 100
subsample_freq=1
cv_splits = 5
cv_gap= 1
boosting_algorithms = ["xgboost", "lightgbm", "catboost"]

[feature_engineering]
feature_selection_methods = ["RFE", "random_forest"]
corr_threshold=0.9
n_features=10